spring.application.name=banco-central-pagos
server.port=8087
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}

# Servicio de cuentas, al que Pagos le pide los descuentos de saldo
cuentas.service.url=http://banco-central-cuentas:8086

# Servidor de autorizacion (credenciales de desarrollo, ver README)
auth.server.url=http://auth-server:9000
auth.server.client-id=ms-seguridad-client
auth.server.client-secret=${OAUTH_CLIENT_SECRET}

# Circuit Breaker sobre las llamadas a cuentas
resilience4j.circuitbreaker.instances.cuentas.sliding-window-size=10
resilience4j.circuitbreaker.instances.cuentas.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.cuentas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cuentas.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.cuentas.permitted-number-of-calls-in-half-open-state=3