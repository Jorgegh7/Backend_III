spring.application.name=bff-web
server.port=8084

banco.central.url=http://banco-central-cuentas:8086
banco.pagos.url=http://banco-central-pagos:8087

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

auth.server.url=http://auth-server:9000
auth.server.client-id=ms-seguridad-client
auth.server.client-secret=${OAUTH_CLIENT_SECRET}

# Circuit Breaker - bancoCentral (cuentas)
resilience4j.circuitbreaker.instances.bancoCentral.sliding-window-size=10
resilience4j.circuitbreaker.instances.bancoCentral.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.bancoCentral.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bancoCentral.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.bancoCentral.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.bancoCentral.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.bancoCentral.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.bancoCentral.ignore-exceptions=com.duoc.bff_web.exception.AccesoDenegadoException,com.duoc.bff_web.exception.CuentaNoEncontradaException,com.duoc.bff_web.exception.TokenInvalidoException,io.github.resilience4j.ratelimiter.RequestNotPermitted

# Retry - bancoCentral (cuentas)
resilience4j.retry.instances.bancoCentral.max-attempts=3
resilience4j.retry.instances.bancoCentral.wait-duration=1000
resilience4j.retry.instances.bancoCentral.enable-exponential-backoff=true
resilience4j.retry.instances.bancoCentral.exponential-backoff-multiplier=2
resilience4j.retry.instances.bancoCentral.ignore-exceptions=com.duoc.bff_web.exception.AccesoDenegadoException,com.duoc.bff_web.exception.CuentaNoEncontradaException,com.duoc.bff_web.exception.TokenInvalidoException,io.github.resilience4j.ratelimiter.RequestNotPermitted

# Rate Limiter - bancoCentral (cuentas)
resilience4j.ratelimiter.instances.bancoCentral.limit-for-period=5
resilience4j.ratelimiter.instances.bancoCentral.limit-refresh-period=10000ms
resilience4j.ratelimiter.instances.bancoCentral.timeout-duration=1000ms

# Circuit Breaker - pagos (transacciones)
resilience4j.circuitbreaker.instances.pagos.sliding-window-size=10
resilience4j.circuitbreaker.instances.pagos.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.pagos.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.pagos.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.pagos.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.pagos.ignore-exceptions=com.duoc.bff_web.exception.AccesoDenegadoException,com.duoc.bff_web.exception.TokenInvalidoException

# Retry - pagos (transacciones)
resilience4j.retry.instances.pagos.max-attempts=3
resilience4j.retry.instances.pagos.wait-duration=1000
resilience4j.retry.instances.pagos.enable-exponential-backoff=true
resilience4j.retry.instances.pagos.exponential-backoff-multiplier=2
resilience4j.retry.instances.pagos.ignore-exceptions=com.duoc.bff_web.exception.AccesoDenegadoException,com.duoc.bff_web.exception.TokenInvalidoException

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,retries,ratelimiters
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true