spring.application.name=banco-central-xyz
spring.config.import=optional:configserver:http://config-server:8888

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/oauth2/jwks

spring.kafka.bootstrap-servers=184.194.138.86:29092,184.194.138.86:39092,184.194.138.86:49092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Los eventos compartidos de ambos microservicios utilizaran este package.
spring.kafka.consumer.properties.spring.json.trusted.packages=com.duoc.eventos

# Permite consumir eventos existentes cuando se utiliza un grupo nuevo.
spring.kafka.consumer.auto-offset-reset=earliest

